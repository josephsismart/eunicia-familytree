<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obeña Christmas Wishlist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');
  :root {
    --bg1:#0b1530; --bg2:#1a0f2e; --gold:#ffd54a; --snow:#eef4ff; --muted:#a9b6d8;
    --modal-bg:#121e36; --modal-border:#26386a; --input-bg:#0d1a30; --text:#f0f4ff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; overflow-x:hidden; color:var(--text);
    font-family:'Nunito',sans-serif;
    background: radial-gradient(ellipse at top, #22305e 0%, var(--bg1) 45%, var(--bg2) 100%);
  }
  .snowfall { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .snowflake { position:absolute; top:-10px; color:#fff; user-select:none; animation:fall linear infinite; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }

  .back-link { display:inline-block; color:var(--muted); text-decoration:none; font-size:13px; padding:10px 16px; position:relative; z-index:2; }
  .back-link:hover { color:#fff; }
  .page-header { text-align:center; padding:4px 16px 0; position:relative; z-index:2; }
  .page-header h1 { font-family:'Mountains of Christmas',cursive; font-size:clamp(28px,6vw,50px); color:var(--gold); margin:0; text-shadow:0 0 24px rgba(255,213,74,.45); }
  .page-header p { color:var(--muted); margin:4px 0 0; font-size:14px; }
  .progress { display:inline-flex; align-items:center; gap:8px; margin-top:10px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; }
  .progress b { color:#5ef08f; }

  /* search */
  .search { position:sticky; top:10px; z-index:50; backdrop-filter:blur(8px); background-color:rgba(20,32,70,.85) !important;
    display:flex; align-items:center; gap:8px; max-width:340px; margin:12px auto 0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:8px 16px; }
  .search:focus-within { border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,213,74,.2); }
  .search input { flex:1; min-width:0; background:none; border:none; outline:none; color:#fff; font:inherit; font-size:15px; }
  .search input::placeholder { color:var(--muted); }
  .s-count { font-size:12px; color:var(--muted); white-space:nowrap; }
  .searching .orn:not(.match) { opacity:.18; filter:grayscale(1); }
  .orn.match .ball { transform:scale(1.25); border-color:#fff !important; box-shadow:0 0 0 3px var(--gold), 0 0 22px 6px rgba(255,213,74,.85); }
  .orn.match .nm { color:var(--gold); }

  /* ===== The tree ===== */
  .scene { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; padding:10px 8px 60px; }
  .star { font-size:58px; line-height:1; margin-bottom:-18px; z-index:6; position:relative; filter:drop-shadow(0 0 18px rgba(255,213,74,.95)); animation:starPulse 2.2s ease-in-out infinite; }
  @keyframes starPulse { 0%,100%{transform:scale(1) rotate(0)} 50%{transform:scale(1.12) rotate(6deg)} }

  .layer { position:relative; display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-end; gap:10px 8px; }
  .layer::before {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background:
      radial-gradient(circle at 30% 70%, rgba(255,255,255,.06) 0 2px, transparent 3px) 0 0/22px 22px,
      linear-gradient(170deg, #2fa560 0%, #1b7a43 45%, #0f5a31 100%);
  }
  .layer::after { /* snowy rim */
    content:''; position:absolute; left:2%; right:2%; bottom:-6px; height:14px; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.85) 0 40%, transparent 70%);
    filter:blur(1px); opacity:.55;
  }
  .layer > * { position:relative; z-index:2; }
  .layer-1 { width:min(250px,70vw);  padding:46px 40px 18px; margin-bottom:-26px; z-index:5; }
  .layer-2 { width:min(400px,84vw);  padding:56px 46px 20px; margin-bottom:-30px; z-index:4; }
  .layer-3 { width:min(560px,94vw);  padding:64px 40px 22px; margin-bottom:-34px; z-index:3; }
  .layer-4 { width:min(720px,98vw);  padding:70px 26px 24px; z-index:2; }

  .trunk { width:70px; height:56px; z-index:1; border-radius:0 0 8px 8px; background:linear-gradient(90deg,#4a2c12,#8b5a2b,#4a2c12); }
  .skirt { width:min(360px,80vw); height:34px; margin-top:-14px; border-radius:50%; background:radial-gradient(ellipse at center,#c0392b 0%,#8e1f17 70%); box-shadow:0 6px 18px rgba(0,0,0,.5); border:3px dashed rgba(255,255,255,.45); }

  /* fairy lights */
  .light { position:absolute; width:7px; height:7px; border-radius:50%; z-index:1; pointer-events:none; animation:twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.35} 50%{opacity:1; box-shadow:0 0 10px 2px currentColor} }

  /* ornaments */
  .orn { display:inline-flex; flex-direction:column; align-items:center; width:58px; cursor:pointer; }
  .orn .cap { width:12px; height:7px; background:linear-gradient(#ffe082,#c9a227); border-radius:3px 3px 1px 1px; margin-bottom:-2px; z-index:3; }
  .orn .ball { width:50px; height:50px; border-radius:50%; overflow:hidden; border:3px solid var(--c,#e74c3c); background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.18); transition:transform .25s, box-shadow .25s; position:relative; }
  .orn .ball::after { content:''; position:absolute; top:6px; left:10px; width:12px; height:7px; border-radius:50%; background:rgba(255,255,255,.55); transform:rotate(-25deg); }
  .orn .ball img { width:100%; height:100%; display:block; }
  .orn:hover .ball { transform:scale(1.25); box-shadow:0 0 18px rgba(255,213,74,.7); z-index:9; }
  .orn .nm { margin-top:3px; font-size:9.5px; font-weight:800; color:#fff; max-width:62px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.9); }

  /* "Wishlist done" — glowing ring + check */
  .chk { position:absolute; top:4px; right:0; width:19px; height:19px; border-radius:50%; background:#2ecc71; color:#fff; font-size:11px; font-weight:900; line-height:15px; text-align:center; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.5); display:none; z-index:10; }
  .orn { position:relative; }
  .orn.is-done .chk { display:block; }
  .orn.is-done .ball { border-color:var(--gold) !important; animation:doneGlow 1.8s ease-in-out infinite; }
  @keyframes doneGlow {
    0%,100% { box-shadow:0 0 8px 2px rgba(255,213,74,.75), 0 0 16px 4px rgba(255,213,74,.35); }
    50%     { box-shadow:0 0 15px 5px rgba(255,213,74,1),  0 0 28px 8px rgba(255,213,74,.6); }
  }

  .orn.memorial { cursor:default; }
  .orn.memorial .ball { border-color:#fff !important; box-shadow:0 0 14px 4px rgba(255,255,255,.55); }
  .orn.memorial .ball img { filter:grayscale(.35); }
  .orn.memorial .chk { display:none !important; }
  .orn.memorial:hover .ball { transform:none; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(4px); }
  .overlay[hidden] { display:none !important; }
  .modal { background:var(--modal-bg); border:1px solid var(--modal-border); border-radius:18px; width:100%; max-width:420px; max-height:85vh; overflow-y:auto; padding:24px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .x { position:absolute; top:10px; right:10px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px; border-radius:6px; }
  .x:hover { color:#fff; background:rgba(255,255,255,.1); }
  .mphoto { width:84px; height:84px; border-radius:50%; border:3px solid var(--gold); margin:0 auto 10px; display:block; background:#fff; }
  .modal h2 { font-family:'Mountains of Christmas',cursive; text-align:center; margin:0 0 2px; font-size:24px; color:var(--gold); }
  .modal h3 { text-align:center; margin:0 0 18px; font-size:13px; color:var(--muted); font-weight:600; }
  .wl { list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:8px; }
  .wi { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--input-bg); border:1px solid var(--modal-border); border-radius:10px; }
  .wi .ic { font-size:20px; }
  .wi .tx { flex:1; font-size:14px; word-break:break-word; }
  .wi .del { background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:14px; opacity:.7; }
  .wi .del:hover { opacity:1; }
  .empty { text-align:center; color:var(--muted); padding:18px; font-size:14px; }
  .empty span { font-size:32px; display:block; margin-bottom:6px; }
  .row { display:flex; gap:8px; }
  .in { flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--modal-border); background:var(--input-bg); color:var(--text); font:inherit; font-size:14px; outline:none; }
  .in:focus { border-color:var(--gold); }
  .add { padding:10px 16px; border-radius:10px; border:none; background:#1e8449; color:#fff; font-weight:800; cursor:pointer; }
  .add:hover { background:#27ae60; }

  @media (max-width:560px) {
    .orn { width:48px; } .orn .ball { width:42px; height:42px; } .orn .nm { font-size:8.5px; max-width:50px; }
    .layer { gap:8px 4px; }
  }
  @media (prefers-reduced-motion: reduce) { .snowflake,.light,.star,.orn.is-done .ball { animation:none !important; } }
</style>
</head>
<body>
<div class="snowfall" id="snowfall"></div>
<a class="back-link" href="/">← Back to Family Tree</a>
<div class="page-header">
  <h1>🎄 Obeña Family Christmas Wishlist</h1>
  <p>Tap your face on the tree to add your wishes! ✨ Glowing + ✓ = wishlist ready</p>
  <div class="progress" id="progress">Loading…</div>
</div>
<div class="search">
    <span class="s-ic">🔍</span>
    <input id="q" type="search" placeholder="Find your name…" autocomplete="off" aria-label="Search family member">
    <span class="s-count" id="qc"></span>
</div>

<div class="scene">
  <div class="star">⭐</div>
  <div class="layer layer-1" id="L1"></div>
  <div class="layer layer-2" id="L2"></div>
  <div class="layer layer-3" id="L3"></div>
  <div class="layer layer-4" id="L4"></div>
  <div class="trunk"></div>
  <div class="skirt"></div>
</div>

<div class="overlay" id="ov" hidden>
  <div class="modal">
    <button class="x" id="x">✕</button>
    <img class="mphoto" id="mp" alt="">
    <h2 id="mn"></h2>
    <h3>🎁 Christmas Wishlist</h3>
    <ul class="wl" id="wl"></ul>
    <div class="row">
      <input class="in" id="win" type="text" placeholder="Add a wish..." maxlength="200">
      <button class="add" id="wadd">Add</button>
    </div>
  </div>
</div>

<script>
(async function () {
  const ICONS = ['🎁','🎀','🧸','🎮','📱','👟','📚','🎧','💝','🧣','⌚','🎂','🍫','🏀','👗','💻','🎸'];
  const RING = ['#e74c3c','#3498db','#9b59b6','#f1c40f','#e91e8f','#1abc9c','#ff8a3d'];

  // snow
  const sf = document.getElementById('snowfall');
  for (let i = 0; i < 45; i++) {
    const s = document.createElement('div');
    s.className = 'snowflake';
    s.textContent = ['❄','❅','❆','•'][i % 4];
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (5 + Math.random() * 7) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    s.style.fontSize = (8 + Math.random() * 14) + 'px';
    s.style.opacity = .25 + Math.random() * .5;
    sf.appendChild(s);
  }

  // ---- family data (Obeña family only) ----
  let members = [];
  try {
    const d = await (await fetch('/api/data')).json();
    const flat = [];
    (function walk(l) { for (const m of l) { flat.push(m); if (m.children) walk(m.children); } })(d.members || []);
    const EXCLUDE = ['1785146785245']; // not part of the Christmas tree
    members = flat.filter(m => Number(m.id) < 1785900000000 && !EXCLUDE.includes(String(m.id)));
  } catch (e) { console.error(e); }

  // ---- vector avatar by age & sex ----
  function ageOf(m) {
    if (!m.birthDate) return 30;
    const b = new Date(m.birthDate);
    return isNaN(b) ? 30 : (Date.now() - b) / 31557600000;
  }
  function avatar(m) {
    const age = ageOf(m);
    const fem = (m.sex || '').toLowerCase() === 'female';
    const hc = age >= 60 ? '#d5d9e0' : '#3d2817';
    const skin = '#ffd8b0';
    let hair = '', extra = '', mouth = '<path d="M43 61 q7 6 14 0" stroke="#a5582c" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    let bg = fem ? '#ffe3ef' : '#dcecff';
    let shirt = fem ? '#e84393' : '#2d7fd3';
    if (age < 5) {             // baby / toddler
      bg = '#fff4cc'; shirt = fem ? '#ff9ec7' : '#7ec8ff';
      hair = `<path d="M50 23 q5 -11 11 -6 q-3 8 -9 10z" fill="${hc}"/>`;
      mouth = '<circle cx="50" cy="64" r="6.5" fill="#ff8fab"/><circle cx="50" cy="64" r="3" fill="#e05a80"/>';
    } else if (fem) {
      if (age < 13) {          // girl: pigtails + bows
        hair = `<path d="M24 46 q-3 -27 26 -28 q29 1 26 28 l-4 -4 q-22 -14 -44 0z" fill="${hc}"/>`
             + `<circle cx="22" cy="48" r="7" fill="${hc}"/><circle cx="78" cy="48" r="7" fill="${hc}"/>`
             + `<path d="M14 40 l8 5 l-8 5z M30 40 l-8 5 l8 5z" fill="#ff4f8b"/><path d="M86 40 l-8 5 l8 5z M70 40 l8 5 l-8 5z" fill="#ff4f8b"/>`;
      } else if (age < 18) {   // teen girl: ponytail
        hair = `<path d="M22 48 q-5 -32 28 -32 q33 0 28 32 q-2 -14 -10 -20 q-18 10 -38 0 q-6 8 -8 20z" fill="${hc}"/>`
             + `<path d="M74 30 q16 6 10 30 q-4 -12 -12 -16z" fill="${hc}"/>`;
      } else {                 // woman: long hair
        hair = `<path d="M19 50 q-6 -34 31 -34 q37 0 31 34 q-1 24 -8 28 l-3 -26 q-20 10 -40 0 l-3 26 q-7 -4 -8 -28z" fill="${hc}"/>`;
        if (age >= 60) extra = '<circle cx="41" cy="49" r="6" fill="none" stroke="#555" stroke-width="1.6"/><circle cx="59" cy="49" r="6" fill="none" stroke="#555" stroke-width="1.6"/><path d="M47 49 h6" stroke="#555" stroke-width="1.6"/>';
      }
    } else {
      if (age < 13) {          // boy: messy short hair + cap
        hair = `<path d="M26 40 q0 -22 24 -22 q24 0 24 22 l-5 3 q-19 -13 -38 0z" fill="${hc}"/>`
             + `<path d="M24 34 q26 -22 52 0 l-3 4 q-23 -13 -46 0z" fill="#e74c3c"/><path d="M70 36 l14 3 l-14 3z" fill="#c0392b"/>`;
      } else if (age < 18) {   // teen boy: spiky
        hair = `<path d="M25 40 l4 -14 l6 8 l5 -12 l6 10 l6 -12 l5 12 l6 -10 l4 14 q-20 -12 -42 4z" fill="${hc}"/>`;
      } else {                 // man
        hair = `<path d="M25 40 q-2 -24 25 -24 q27 0 25 24 l-5 2 q-20 -14 -40 0z" fill="${hc}"/>`;
        if (age >= 60) {       // lolo: grey beard + glasses
          extra = `<path d="M30 58 q20 26 40 0 q-4 18 -20 20 q-16 -2 -20 -20z" fill="${hc}"/>`
                + '<circle cx="41" cy="49" r="6" fill="none" stroke="#555" stroke-width="1.6"/><circle cx="59" cy="49" r="6" fill="none" stroke="#555" stroke-width="1.6"/><path d="M47 49 h6" stroke="#555" stroke-width="1.6"/>';
        } else if (age >= 25) {
          extra = `<path d="M40 57 q10 4 20 0" stroke="${hc}" stroke-width="3" fill="none" stroke-linecap="round"/>`; // moustache
        }
      }
    }
    const santa = '<path d="M26 26 q24 -30 48 0z" fill="#d62828"/><rect x="24" y="24" width="52" height="7" rx="3.5" fill="#fff"/><circle cx="76" cy="12" r="5" fill="#fff"/><path d="M60 8 q12 -2 16 4 l-6 6z" fill="#d62828"/>';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bg}"/>
      <path d="M16 100 q0 -26 34 -26 q34 0 34 26z" fill="${shirt}"/>
      <circle cx="50" cy="50" r="25" fill="${skin}"/>
      ${hair}
      <circle cx="41" cy="50" r="2.9" fill="#2b1d12"/><circle cx="59" cy="50" r="2.9" fill="#2b1d12"/>
      <circle cx="34" cy="58" r="4" fill="#ff9fb2" opacity=".6"/><circle cx="66" cy="58" r="4" fill="#ff9fb2" opacity=".6"/>
      ${mouth}${extra}${age >= 5 ? santa : ''}
    </svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  // ---- wishlists ----
  let wishlists = {};
  const norm = w => { const o = {}; for (const [k, v] of Object.entries(w || {})) o[k] = v.map(i => typeof i === 'string' ? { text: i, id: '' } : i); return o; };
  try { const r = await fetch('/api/wishlist'); if (r.ok) wishlists = norm(await r.json()); } catch (e) {}

  const els = {};
  const isDone = id => !!(wishlists[id] && wishlists[id].length);
  function updateProgress() {
    const living = members.filter(m => !(m.isDeceased || m.deathDate));
    const done = living.filter(m => isDone(m.id)).length;
    document.getElementById('progress').innerHTML = `🎁 <b>${done}</b> of ${living.length} wishlists ready`;
  }
  function applyDone(id) { if (els[id]) els[id].classList.toggle('is-done', isDone(id)); }
  function refreshAll() { Object.keys(els).forEach(applyDone); updateProgress(); }

  // ---- place EVERY member on the tree (4 layers, bigger toward the bottom) ----
  const bd = m => m.birthDate && !isNaN(new Date(m.birthDate)) ? new Date(m.birthDate).getTime() : Infinity;
  const list = [...members].sort((a, b) => bd(a) - bd(b)); // eldest at top, youngest at bottom
  const n = list.length;
  const c1 = Math.round(n * .10), c2 = Math.round(n * .20), c3 = Math.round(n * .30);
  const dead = m => !!(m.isDeceased || m.deathDate);
  const yrs = m => m.birthDate && !isNaN(new Date(m.birthDate)) ? (Date.now() - new Date(m.birthDate)) / 31557600000 : 0;
  const rest = list.filter(m => !dead(m) && yrs(m) < 60), half = Math.round(rest.length * .42);
  // top: in loving memory, then seniors (60+), then everyone else eldest -> youngest
  const groups = [list.filter(dead), list.filter(m => !dead(m) && yrs(m) >= 60), rest.slice(0, half), rest.slice(half)];
  let k = 0;
  groups.forEach((g, li) => {
    const layer = document.getElementById('L' + (li + 1));
    g.forEach(m => {
      const o = document.createElement('div');
      o.className = 'orn';
      o.style.setProperty('--c', RING[k++ % RING.length]);
      o.title = m.firstName + ' ' + (m.lastName || '');
      o.innerHTML = `<div class="cap"></div><div class="ball"><img alt=""></div><div class="nm"></div><div class="chk">✓</div>`;
      const im = o.querySelector('img'); im.onerror = () => { im.onerror = null; im.src = avatar(m); }; im.src = m.photo || avatar(m); im.style.objectFit = 'cover';
      o.querySelector('img').alt = m.firstName;
      o.querySelector('.nm').textContent = m.firstName;
      if (dead(m)) { o.classList.add('memorial'); o.title += ' — in loving memory'; o.querySelector('.nm').textContent = '🕊️ ' + m.firstName; } else o.onclick = () => openModal(m);
      layer.appendChild(o);
      els[m.id] = o;
    });
    // fairy lights on this layer
    const colors = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#ff80ab', '#ffffff'];
    for (let i = 0; i < 6 + li * 4; i++) {
      const L = document.createElement('div');
      L.className = 'light';
      const y = 20 + Math.random() * 75;            // keep inside the triangle
      const half = (y / 100) * 46;
      L.style.top = y + '%';
      L.style.left = (50 - half + Math.random() * half * 2) + '%';
      L.style.color = colors[i % colors.length];
      L.style.background = 'currentColor';
      L.style.animationDelay = (Math.random() * 2) + 's';
      layer.appendChild(L);
    }
  });
  refreshAll();

  // ---- search ----
  const q = document.getElementById('q'), qc = document.getElementById('qc'), scene = document.querySelector('.scene');
  const fold = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function doSearch(go) {
    const t = fold(q.value.trim());
    const hits = [];
    for (const m of members) {
      const el = els[m.id];
      const ok = t && fold(m.firstName + ' ' + (m.middleName || '') + ' ' + (m.lastName || '')).includes(t);
      el.classList.toggle('match', !!ok);
      if (ok) hits.push(m);
    }
    scene.classList.toggle('searching', !!t);
    qc.textContent = t ? (hits.length ? hits.length + ' found' : 'no match') : '';
    if (hits.length) els[hits[0].id].scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (go && hits.length === 1 && !dead(hits[0])) openModal(hits[0]);
  }
  q.oninput = () => doSearch(false);
  q.onkeydown = e => { if (e.key === 'Enter') doSearch(true); if (e.key === 'Escape') { q.value = ''; doSearch(false); } };

  // ---- modal ----
  let cur = null;
  const ov = document.getElementById('ov'), wl = document.getElementById('wl'), win = document.getElementById('win');
  function render() {
    const items = wishlists[cur] || [];
    wl.innerHTML = '';
    if (!items.length) { wl.innerHTML = '<li class="empty"><span>🎄</span>No wishes yet!<br>Add one below.</li>'; return; }
    items.forEach((w, i) => {
      const li = document.createElement('li');
      li.className = 'wi';
      li.innerHTML = `<span class="ic">${ICONS[i % ICONS.length]}</span><span class="tx"></span><button class="del" title="Remove">✕</button>`;
      li.querySelector('.tx').textContent = w.text;
      li.querySelector('.del').onclick = () => removeWish(w.id, i);
      wl.appendChild(li);
    });
  }
  async function openModal(m) {
    cur = m.id;
    const mp = document.getElementById('mp'); mp.onerror = () => { mp.onerror = null; mp.src = avatar(m); }; mp.src = m.photo || avatar(m); mp.style.objectFit = 'cover';
    document.getElementById('mn').textContent = m.firstName + ' ' + (m.lastName || '');
    win.value = '';
    render();
    ov.hidden = false;
    try { const r = await fetch('/api/wishlist'); if (r.ok) { wishlists = norm(await r.json()); if (cur === m.id) render(); refreshAll(); } } catch (e) {}
  }
  const close = () => { ov.hidden = true; cur = null; };
  document.getElementById('x').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };

  async function addWish() {
    const text = win.value.trim();
    if (!text || !cur) return;
    (wishlists[cur] = wishlists[cur] || []).push({ text, id: '' });
    win.value = ''; render(); applyDone(cur); updateProgress();
    try {
      const r = await fetch('/api/wishlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memberId: cur, item: text }) });
      if (r.ok) { wishlists = norm(await r.json()); if (cur) render(); refreshAll(); }
    } catch (e) { console.error(e); }
  }
  async function removeWish(itemId, idx) {
    if (!cur) return;
    (wishlists[cur] || []).splice(idx, 1);
    render(); applyDone(cur); updateProgress();
    if (!itemId) return;
    try {
      const r = await fetch('/api/wishlist', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memberId: cur, itemId }) });
      if (r.ok) { wishlists = norm(await r.json()); if (cur) render(); refreshAll(); }
    } catch (e) { console.error(e); }
  }
  document.getElementById('wadd').onclick = addWish;
  win.onkeydown = e => { if (e.key === 'Enter') addWish(); };
})();
</script>
</body>
</html>
